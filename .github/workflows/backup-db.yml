name: Backup database

# Supabase's free tier has no automated backups or point-in-time recovery —
# this workflow is the only backup mechanism this project has. Runs a full
# pg_dump against production daily and keeps the result as a workflow
# artifact. See DISASTER_RECOVERY.md for how to restore from one and for the
# honest RPO/RTO this setup actually provides.
on:
  schedule:
    - cron: "11 19 * * *" # ~02:11 ICT
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Ubuntu's default postgresql-client is v16, but Supabase runs
      # Postgres 17 — pg_dump refuses to dump a server newer than itself.
      # Pull v17 specifically from the official PostgreSQL APT repo instead
      # of whatever version ubuntu-latest's default repos happen to carry.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump production database
        run: |
          filename="aseango-backup-$(date -u +%Y-%m-%dT%H%M%SZ).dump"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f "$filename"
          echo "BACKUP_FILENAME=$filename" >> "$GITHUB_ENV"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # This artifact contains full production data, including password
      # hashes and payment records — never commit a dump to git history
      # (that leak would be permanent). Artifacts are private to this repo
      # and only reachable by someone with repo access.
      - name: Upload backup as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILENAME }}
          path: ${{ env.BACKUP_FILENAME }}
          retention-days: 30
