name: Deploy

# Runs only after CI passes on main, so a broken build never reaches
# production. Requires these repo secrets (Settings → Secrets and variables →
# Actions) — see DEPLOYMENT.md for how to obtain each one:
#   RENDER_DEPLOY_HOOK_URL - Render dashboard → aseango-backend service →
#                            Settings → Deploy Hook → copy URL. A bare
#                            authenticated URL, not an API key — hitting it
#                            with a POST triggers a deploy of latest main.
#   PRODUCTION_DATABASE_URL - same Supabase pooler connection string set in
#                             the Render service's DATABASE_URL env var, so
#                             this workflow can apply pending migrations
#                             before the new code (which may expect them)
#                             goes live
#
# The admin dashboard is NOT deployed from here — Vercel's own GitHub
# integration already auto-deploys it on every push to main independently.
# A deploy-admin job used to duplicate that via the Vercel CLI, but it had
# no working VERCEL_TOKEN configured and was failing on every run without
# actually being needed.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  migrate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations
        working-directory: backend
        run: ./db/migrate.sh
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  deploy-backend:
    needs: migrate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "status=$status"
          if [ "$status" -ge 300 ]; then
            echo "Render deploy hook returned $status" >&2
            exit 1
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
